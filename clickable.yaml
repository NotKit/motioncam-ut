clickable_minimum_required: 8.8.0
builder: cmake
build_args:
    - -DCMAKE_BUILD_TYPE=Release
dependencies_target:
    - libhybris-dev
    - qtbase5-dev
    - qtdeclarative5-dev
    - libopencv-core-dev
    - libopencv-imgproc-dev
    - libopencv-photo-dev
    - libzstd-dev
install_lib:
    - libopencv_core.so*
    - libopencv_imgproc.so*
    - libopencv_photo.so*
    - libzstd.so*
    - libtbb.so*
skip_review: true
kill: motioncam
