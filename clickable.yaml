clickable_minimum_required: 8.8.0
builder: cmake
build_args:
    - -DCMAKE_BUILD_TYPE=Release
dependencies_target:
    - libhybris-dev
    - qtbase5-dev
    - qtdeclarative5-dev
    - libopencv-core-dev
    - libopencv-imgproc-dev
    - libopencv-photo-dev
    - libopencv-video-dev
    - libjpeg-dev
    - libpng-dev
    - libzstd-dev
    - libexiv2-dev
install_lib:
    - libopencv_core.so*
    - libopencv_features2d.so*
    - libopencv_flann.so*
    - libopencv_imgproc.so*
    - libopencv_photo.so*
    - libopencv_calib3d.so*
    - libopencv_video.so*
    - libzstd.so*
    - libtbb.so*
    - libexiv2.so*
skip_review: true
kill: motioncam
